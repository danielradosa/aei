
# ── Themed Hyprland config (recovery) ──────────────────────────────────────

monitor=DP-2,1920x1080@144,0x0,1

$mod  = SUPER
$term = kitty
$menu = rofi -show drun

source = ~/.cache/wal/colors-hyprland.conf

env = XDG_DATA_DIRS,/var/lib/flatpak/exports/share:/home/daniel/.local/share/flatpak/exports/share:/usr/local/share:/usr/share
env = GTK_THEME,Adwaita:dark
env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORMTHEME,kvantum
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct

input {
kb_layout = us
follow_mouse = 1
touchpad {
    natural_scroll = true
}
sensitivity = -0.0625
accel_profile = flat

# Fast key-repeat — kicks in everywhere (terminal, nvim, browser, fields).
# repeat_delay = ms before a held key starts repeating
# repeat_rate  = repeats per second once it kicks in
repeat_delay = 220
repeat_rate  = 50
}

general {
gaps_in = 4
gaps_out = 8
border_size = 2
col.active_border   = $color3 $color2 $color4 45deg
col.inactive_border = $color0
layout = dwindle
}

decoration {
    rounding = 10
    active_opacity   = 1.0
    inactive_opacity = 0.93

    blur {
        enabled          = true
        size             = 8
        passes           = 3
        noise            = 0.02
        contrast         = 1.1
        brightness       = 0.85
        vibrancy         = 0.18
        new_optimizations = true
    }

    shadow {
        enabled       = true
        range         = 22
        render_power  = 3
        color         = rgba(e7ae2938)
        color_inactive = rgba(08040488)
    }
}

animations {
    enabled = true

    bezier = spring,   0.16, 1,    0.3,  1.15
    bezier = dissolve, 0.4,  0,    0.2,  1
    bezier = snap,     0.19, 1,    0.22, 1
    bezier = linear,   1,    1,    0,    0

    animation = windowsIn,         1, 4,  spring,  popin 85%
    animation = windowsOut,        1, 3,  snap,    popin 85%
    animation = windowsMove,       1, 4,  spring
    animation = fade,              1, 4,  dissolve
    animation = workspaces,        1, 4,  snap,    slide
    animation = specialWorkspace,  1, 4,  snap,    slidefadevert 30%
    animation = border,            1, 5,  dissolve
    animation = borderangle,       1, 60, linear,  loop
}

dwindle { pseudotile = true; preserve_split = true; split_ratio = 1.618 }
misc    { disable_hyprland_logo = true; force_default_wallpaper = 0 }

# Autostart

exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/Pictures/wallpapers/alchemy-bg.png --transition-type any
exec-once = wal --theme alchemia && pywalfox update && cp ~/.cache/wal/mako ~/.config/mako/config
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = swayosd-server
exec-once = [workspace special:scratch silent] kitty --class kitty-scratch

# Keybinds

bind = $mod,       Return,  exec,                $term
bind = $mod,       Q,       killactive
bind = $mod SHIFT, E,       exec,                wlogout -p layer-shell
bind = $mod,       E,       exec,                thunar
bind = $mod,       R,       exec,                $menu
bind = $mod,       V,       togglefloating
bind = $mod SHIFT, V,       exec,                cliphist list | rofi -dmenu -p "󰅇 clipboard" | cliphist decode | wl-copy
bind = $mod,       F,       fullscreen
bind = $mod,       P,       pseudo
bind = $mod,       J,       togglesplit
bind = $mod,       L,       exec,                hyprlock
bind = $mod,       grave,   togglespecialworkspace, scratch
bind = $mod SHIFT, grave,   movetoworkspace,     special:scratch

bind = $mod,       left,  movefocus,  l
bind = $mod,       right, movefocus,  r
bind = $mod,       up,    movefocus,  u
bind = $mod,       down,  movefocus,  d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = , Print,         exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print,    exec, grim - | swappy -f -

bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# Window rules

windowrule {
    name = scratchpad
    match:class = ^(kitty-scratch)$
    float = true
    size = 920 580
    center = true
}

windowrule {
    name = pavucontrol
    match:class = ^(pavucontrol)$
    float = true
    size = 820 520
    center = true
}

windowrule {
    name = nm-connection-editor
    match:class = ^(nm-connection-editor)$
    float = true
    center = true
}

windowrule {
    name = blueman
    match:class = ^(blueman-manager)$
    float = true
    center = true
}

windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Workspace assignments

windowrule {
    name = firefox-ws
    match:class = ^(firefox)$
    workspace = 2
}

windowrule {
    name = spotify-ws
    match:class = ^(Spotify)$
    workspace = 3
}

windowrule {
    name = discord-ws
    match:class = ^(discord)$
    workspace = 3
}
