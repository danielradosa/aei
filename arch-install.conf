# arch-install.conf — non-interactive install config.
# Use with:  ./arch-install.sh --config arch-install.conf
# Each value is just an env var the script sources before running.

HOSTNAME="arch"
USERNAME="daniel"
TIMEZONE="Europe/Copenhagen"
LOCALE="en_US.UTF-8"
KEYMAP="us"

KERNEL="linux"                  # linux | linux-lts | linux-zen | linux-hardened
FILESYSTEM="btrfs"              # ext4 | btrfs
ENCRYPT="yes"                   # yes | no  (LUKS2 on root)
SWAP_SIZE="24G"                 # "0" to skip
BOOTLOADER="auto"               # auto picks systemd-boot on UEFI, grub on BIOS

# Disk to install on. Comment to be prompted.
# Confirm with: lsblk -dpno NAME,SIZE,TYPE
DISK="/dev/sda"
# DISK="/dev/nvme0n1"
# DISK="/dev/vda"

# ── Dualboot (Windows) ──────────────────────────────────────────────────────
# Set MANUAL_PARTITION="yes" if you've already partitioned the disk yourself
# (e.g. shrunk Windows in Disk Management, then made a new partition for Arch
# in the freed space with cfdisk). aei will then SKIP wiping the disk and use
# the partitions you name below — only the Linux ROOT_PART gets formatted; the
# existing Windows ESP is left intact so Windows still boots from it.
#
# Comment these out for a fresh single-OS install (default).
# MANUAL_PARTITION="yes"
# ROOT_PART="/dev/nvme0n1p4"        # the new partition you cut for Arch
# ESP_PART="/dev/nvme0n1p1"         # Windows' EFI System Partition (re-used)

DESKTOP="hyprland"              # hyprland | none
SHELL_CHOICE="zsh"              # zsh | bash | fish
AUR_HELPER="paru"               # paru | yay | none
INSTALL_NVIDIA="auto"           # auto | yes | no   (auto = lspci-detect)

# Repo to clone into ~/aei after install — drives phase 3 dotfiles + AUR list.
AEI_REPO="https://github.com/danielradosa/aei.git"
AEI_BRANCH="main"

ENABLE_MULTILIB="yes"
ENABLE_SERVICES="NetworkManager bluetooth sshd docker"

# Passwords — leave commented to be prompted interactively (recommended).
# If you set them here: chmod 600 this file and delete it after install.
# ROOT_PASSWORD=""
# USER_PASSWORD=""
# LUKS_PASSWORD=""
