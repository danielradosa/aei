source = ~/.cache/wal/colors-hyprland.conf

background {
    monitor =
    path         = ~/Pictures/wallpapers/alchemy-bg.png
    blur_passes  = 3
    blur_size    = 6
    brightness   = 0.65
}

# ── Clock ─────────────────────────────────────────────────
label {
    monitor =
    text        = cmd[update:1000] echo "$(date +'%H∷%M')"
    color       = $color4
    font_size   = 96
    font_family = JetBrainsMono Nerd Font Bold
    position    = 0, 140
    halign      = center
    valign      = center
    shadow_passes = 3
    shadow_size   = 12
    shadow_color  = rgba(00000099)
}

# ── Date ──────────────────────────────────────────────────
label {
    monitor =
    text        = cmd[update:60000] echo "⚗  $(date +'%A, %d %B %Y')"
    color       = $color7
    font_size   = 20
    font_family = JetBrainsMono Nerd Font
    position    = 0, 60
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(00000099)
}

# ── Password field ────────────────────────────────────────
input-field {
    monitor =
    size              = 280, 52
    position          = 0, -80
    halign            = center
    valign            = center
    outline_thickness = 2
    outer_color       = $color4
    inner_color       = $color0
    font_color        = $color7
    check_color       = $color5
    fail_color        = $color1
    fade_on_empty     = true
    placeholder_text  = <i>⚗  Transmute…</i>
    rounding          = 10
}
