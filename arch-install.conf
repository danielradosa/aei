# arch-install.conf — non-interactive install config
# Use with:  ./arch-install.sh --config arch-install.conf
# Every value is just an env var the script sources before running.

HOSTNAME="arch"
USERNAME="daniel"
TIMEZONE="Europe/Copenhagen"
LOCALE="en_US.UTF-8"
KEYMAP="us"

KERNEL="linux"                  # linux | linux-lts | linux-zen | linux-hardened
FILESYSTEM="btrfs"              # ext4 | btrfs
ENCRYPT="yes"                   # yes | no   (LUKS2 on root)
SWAP_SIZE="24G"                 # "0" to skip
BOOTLOADER="auto"               # auto picks systemd-boot on UEFI, grub on BIOS

# Disk to install on. Uncomment and set explicitly to skip the picker —
# safest for VMs with one disk, and required if whiptail glitches.
# Use the FULL path. Confirm with: lsblk -dpno NAME,SIZE,TYPE
DISK="/dev/sda"
# DISK="/dev/nvme0n1"
# DISK="/dev/vda"

DESKTOP="hyprland"              # hyprland | kde | gnome | sway | i3 | none
SHELL_CHOICE="zsh"              # zsh | bash | fish
AUR_HELPER="paru"               # paru | yay | none
INSTALL_NVIDIA="auto"           # auto (detect via lspci) | yes | no

DOTFILES_REPO="https://github.com/yourname/dotfiles.git"
DOTFILES_METHOD="stow"          # stow | bare | script
DOTFILES_BRANCH="main"
DOTFILES_INSTALL_SCRIPT="install.sh"

ENABLE_MULTILIB="yes"
EXTRA_PACKAGES="git curl wget neovim tmux htop ranger fzf ripgrep fd bat eza zoxide stow openssh man-db unzip zip tree jq python python-pip nodejs npm docker docker-compose php composer"
ENABLE_SERVICES="NetworkManager bluetooth sshd docker"

# Passwords — leave unset to be prompted interactively (recommended).
# If you set them here, chmod 600 this file and delete it after install.
# ROOT_PASSWORD=""
# USER_PASSWORD=""
# LUKS_PASSWORD=""
